[package]
name = "crosshair-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
crosshair-core.workspace = true
crosshair-renderer.workspace = true
crosshair-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "raw-window-handle-06", "unstable-winit-030"] }
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation", "UI_ViewManagement",
    "Win32_Foundation", "Win32_System_Com", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security", "Win32_UI_Controls_Dialogs",
] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
