[workspace]
members = ["apps/engine", "apps/editor", "crates/core", "crates/renderer", "crates/platform"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE.md"
repository = "https://github.com/ohne-b/crosshair-rs"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.21"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
windows = "0.62.2"
tempfile = "3.27.0"
crosshair-core = { path = "crates/core" }
crosshair-renderer = { path = "crates/renderer" }
crosshair-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
