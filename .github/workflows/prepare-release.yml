name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next version, for example 0.1.0-alpha.1 or 0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'ohne-b/crosshair-rs' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PUBLISHER_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - name: Prepare version and lockfile
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: |
          if (!$env:GH_TOKEN) { throw 'PUBLISHER_TOKEN is required so the draft PR receives normal validation.' }
          npm --prefix scripts ci --ignore-scripts
          if ($LASTEXITCODE) { throw 'Maintenance dependency restore failed.' }
          cargo fetch --locked
          if ($LASTEXITCODE) { throw 'Cargo dependency restore failed.' }
          New-Item -ItemType Directory -Force target | Out-Null
          node scripts/release.mjs bump $env:RELEASE_VERSION
          if ($LASTEXITCODE) { throw 'Release preparation failed.' }
          $branch = "feat/release-$env:RELEASE_VERSION"
          git switch -c $branch
          if ($LASTEXITCODE) { throw 'Release branch already exists.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock
          git diff --cached --check
          if ($LASTEXITCODE) { throw 'Release diff failed validation.' }
          git commit -m "chore(release): prepare $env:RELEASE_VERSION"
          if ($LASTEXITCODE) { throw 'Release commit failed.' }
          gh auth setup-git
          if ($LASTEXITCODE) { throw 'Scoped publication credential setup failed.' }
          git push --set-upstream origin $branch
          if ($LASTEXITCODE) { throw 'Release branch push failed.' }
          $body = "Updates the Cargo workspace and lockfile version together.`n`nAdd a concise CHANGELOG.md entry for this version. Keep this PR in draft until validation and independent adversarial review pass. After merging, run Publish release from main with this version; latest.json is generated and attached automatically."
          [IO.File]::WriteAllText((Join-Path $PWD 'target/release-pr.md'), $body)
          gh pr create --draft --base main --head $branch --title "chore(release): prepare $env:RELEASE_VERSION" --body-file target/release-pr.md
          if ($LASTEXITCODE) { throw 'Draft release PR creation failed.' }
