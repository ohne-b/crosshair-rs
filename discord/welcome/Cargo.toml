[package]
name = "crosshair-rs-welcome-renderer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
description = "Offline renderer for the crosshair-rs welcome banner"
publish = false

[lib]
name = "crosshair_welcome"

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
rustybuzz = "=0.20.1"
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.13.3"

[lints.rust]
unsafe_code = "forbid"
