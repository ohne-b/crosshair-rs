<svg version="1.1" height="1024" width="1024" viewBox="0 0 106 106" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
<title>Rust Crosshair — Orange</title>
<desc>Original Rust gear, mounting-tab and screw-hole geometry preserved, colored charcoal #3F454D. The R is replaced by four slim crosshair bars in orange #F97316. Rust Project artwork, CC BY 4.0; source: https://github.com/rust-lang/rust-artwork/blob/main/logo/rust-logo-gear-only.svg</desc>
<g id="logo" transform="translate(53, 53)">
  <g id="gear" fill="#3F454D" mask="url(#holes)">
    <circle r="43" fill="none" stroke="#3F454D" stroke-width="9" />
    <g id="cogs">
      <polygon id="cog" stroke="#3F454D" stroke-width="3" stroke-linejoin="round" points="46,3 51,0 46,-3" />
      <use xlink:href="#cog" transform="rotate(11.25)" />
      <use xlink:href="#cog" transform="rotate(22.50)" />
      <use xlink:href="#cog" transform="rotate(33.75)" />
      <use xlink:href="#cog" transform="rotate(45.00)" />
      <use xlink:href="#cog" transform="rotate(56.25)" />
      <use xlink:href="#cog" transform="rotate(67.50)" />
      <use xlink:href="#cog" transform="rotate(78.75)" />
      <use xlink:href="#cog" transform="rotate(90.00)" />
      <use xlink:href="#cog" transform="rotate(101.25)" />
      <use xlink:href="#cog" transform="rotate(112.50)" />
      <use xlink:href="#cog" transform="rotate(123.75)" />
      <use xlink:href="#cog" transform="rotate(135.00)" />
      <use xlink:href="#cog" transform="rotate(146.25)" />
      <use xlink:href="#cog" transform="rotate(157.50)" />
      <use xlink:href="#cog" transform="rotate(168.75)" />
      <use xlink:href="#cog" transform="rotate(180.00)" />
      <use xlink:href="#cog" transform="rotate(191.25)" />
      <use xlink:href="#cog" transform="rotate(202.50)" />
      <use xlink:href="#cog" transform="rotate(213.75)" />
      <use xlink:href="#cog" transform="rotate(225.00)" />
      <use xlink:href="#cog" transform="rotate(236.25)" />
      <use xlink:href="#cog" transform="rotate(247.50)" />
      <use xlink:href="#cog" transform="rotate(258.75)" />
      <use xlink:href="#cog" transform="rotate(270.00)" />
      <use xlink:href="#cog" transform="rotate(281.25)" />
      <use xlink:href="#cog" transform="rotate(292.50)" />
      <use xlink:href="#cog" transform="rotate(303.75)" />
      <use xlink:href="#cog" transform="rotate(315.00)" />
      <use xlink:href="#cog" transform="rotate(326.25)" />
      <use xlink:href="#cog" transform="rotate(337.50)" />
      <use xlink:href="#cog" transform="rotate(348.75)" />
    </g>
    <g id="mounts">
      <polygon id="mount" stroke="#3F454D" stroke-width="6" stroke-linejoin="round" points="-7,-42 0,-35 7,-42" />
      <use xlink:href="#mount" transform="rotate(72)" />
      <use xlink:href="#mount" transform="rotate(144)" />
      <use xlink:href="#mount" transform="rotate(216)" />
      <use xlink:href="#mount" transform="rotate(288)" />
    </g>
  </g>
  <mask id="holes">
    <rect x="-60" y="-60" width="120" height="120" fill="white"/>
    <circle id="hole" cy="-40" r="3" />
    <use xlink:href="#hole" transform="rotate(72)" />
    <use xlink:href="#hole" transform="rotate(144)" />
    <use xlink:href="#hole" transform="rotate(216)" />
    <use xlink:href="#hole" transform="rotate(288)" />
  </mask>
  <g id="crosshair" fill="#F97316" stroke="none">
    <rect id="crosshair-top" x="-1.75" y="-26" width="3.5" height="19.5" rx="0.5"/>
    <rect id="crosshair-right" x="6.5" y="-1.75" width="19.5" height="3.5" rx="0.5"/>
    <rect id="crosshair-bottom" x="-1.75" y="6.5" width="3.5" height="19.5" rx="0.5"/>
    <rect id="crosshair-left" x="-26" y="-1.75" width="19.5" height="3.5" rx="0.5"/>
  </g>
</g>
</svg>
