[package]
name = "crosshair-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
crosshair-core.workspace = true
serde_json.workspace = true
tiny-skia = { version = "0.12.0", default-features = false, features = ["std", "simd", "png-format"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
resvg = { version = "0.49.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
roxmltree = "0.21.1"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows-numerics = "0.3.1"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
] }

[lints]
workspace = true
